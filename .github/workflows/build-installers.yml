name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - name: Build Windows installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: watch-x-windows
          path: |
            release/WatchX-*-Setup-*.exe
            release/WatchX-*-Portable-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: watch-x-macos
          path: |
            release/WatchX-*-mac-*.dmg
            release/WatchX-*-mac-*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - name: Build Linux installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: watch-x-linux
          path: |
            release/WatchX-*-linux-*.deb
            release/WatchX-*-linux-*.AppImage
          if-no-files-found: error

  publish-release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          shopt -s nullglob
          FILES=(artifacts/WatchX-*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installer files found"
            ls -laR artifacts || true
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Watch X ${VERSION}" \
              --notes "Offline self-contained installers for Windows, macOS and Linux."
          fi
